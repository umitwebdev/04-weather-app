<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wetter App</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="intro-overlay"></div>
  <div class="container">
    <h1>Wetter</h1>
    <input type="text" id="stadt-eingabe" placeholder="Stadt eingeben...">
    <div id="vorschlaege"></div>
    <button onclick="holeWetter()">Suchen</button>
    <button id="standort-btn" onclick="holeStandort()">📍 Aktueller Standort</button>
    <p id="ergebnis">🌍 Stadt eingeben und Wetter abrufen.</p>
    <div id="fakten"></div>
    <div id="forecast"></div>
    <div id="chart-container">
      <canvas id="temp-chart"></canvas>
      <canvas id="regen-chart"></canvas>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="stadtFakten.js"></script>
  <script src="script.js"></script>
</body>
</html>
